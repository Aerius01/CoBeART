name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cobeart-app/package-lock.json

      # Importing soundcard (via cobeart/audio/utils.py) connects to
      # PulseAudio at import time, so the audio tests need a daemon running.
      - name: Start PulseAudio with a null sink
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl info

      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"

      - name: Install Node dependencies
        working-directory: cobeart-app
        run: npm ci

      - name: pytest
        run: python -m pytest

      - name: flake8
        run: python -m flake8 cobeart

      - name: npm test
        working-directory: cobeart-app
        run: npm test

      - name: Fitness checks
        run: node scripts/fitness.mjs

      - name: Fitness check tests
        run: node --test scripts/fitness.test.mjs
