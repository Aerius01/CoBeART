<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CoBeART</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Socket.IO client served by the server automatically at /socket.io/socket.io.js -->
    <link rel="stylesheet" href="/host/shared-border.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
            /* optional, avoids white borders while loading */
        }

        #worldFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <script src="/socket.io/socket.io.js"></script>
    <!-- The world (Splat) is structured as an embedded standalone browser (black box). -->
    <iframe id="worldFrame" src="/worlds/splat/index.html">
    </iframe>
    <script src="/host/bridge.js"></script>
    <script src="/host/border-control.js"></script>

</body>

</html>
