<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CoBeART</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Socket.IO client served by the server automatically at /socket.io/socket.io.js -->
    <link rel="stylesheet" href="/host/shared-border.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
            /* optional, avoids white borders while loading */
        }

        #worldFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #hostError {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            padding: 16px;
            color: white;
            background: #8b1a1a;
            font: 16px monospace;
            z-index: 20;
        }

        #hostError[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <script src="/socket.io/socket.io.js"></script>
    <!-- The world is an embedded standalone page (black box); host.js sets its src from ?world= -->
    <iframe id="worldFrame"></iframe>
    <div id="hostError" hidden></div>
    <script src="/host/host.js"></script>
    <script src="/host/bridge.js"></script>
    <script src="/host/border-control.js"></script>
    <script src="/host/keys.js"></script>

</body>

</html>
