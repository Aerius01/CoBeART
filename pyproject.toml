[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CoBeArt"
version = "1.0"
description = "Audio-visual demonstrator using spatial augmented reality, real-time body tracking and rendering"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "David Mezey & David James"}
]
maintainers = [
    {name = "David Mezey & David James"}
]
keywords = ["audio", "visual", "augmented reality", "motion tracking", "optitrack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2",
    "scipy",
    "python-socketio[client]",
    "pyyaml",
    "soundcard",
    "madmom @ git+https://github.com/CPJKU/madmom.git@27f032e8947204902c675e5e341a3faf5dc86dae",
]

[project.optional-dependencies]
test = [
    "bandit",
    "flake8",
    "jsonschema",
    "pytest",
    "pytest-cov",
]
viz = [
    "matplotlib",
]

[project.scripts]
start-optitrack-client = "cobeart.optitrackclient.start_client:start"
start-audio-client = "cobeart.audiocapture.capture:main"
start-simulator = "cobeart.simulator.__main__:main"

[project.urls]
Homepage = "https://github.com/mezdahun/CoBeART"
Repository = "https://github.com/mezdahun/CoBeART"
Issues = "https://github.com/mezdahun/CoBeART/issues"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
cobeart = ["*.txt"]

[tool.setuptools]
zip-safe = false

[tool.pytest.ini_options]
testpaths = ["cobeart"]
